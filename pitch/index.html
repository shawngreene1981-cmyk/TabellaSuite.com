<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mall pitch | Tabella</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* A pitch deck that fills itself in for the mall being pitched, from the Tabella map.
   /pitch/                      pick a shop from the map
   /pitch/?shop=<id>&booths=N   the deck for that shop (id as the map uses it); booths sets the price slide
   Keys: arrows, space, Home/End. Print or save as PDF for a one-slide-per-page handout. */
:root{--bg:#F4EFE6;--bg2:#EBE4D6;--ink:#231F1A;--muted:#6A6259;--line:#D5CCBA;--terra:#9A4A2E;--terra-ink:#FFF8F0;--gold:#A8842F;--card:#FBF8F2;--green:#3F6B45}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#191613;color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;line-height:1.05;margin:0;text-wrap:balance}
.cap{font-family:Cinzel,'Times New Roman',serif;letter-spacing:.18em;text-transform:uppercase;font-size:13px;color:var(--gold);font-weight:600}
a{color:var(--terra)}
/* picker */
#pick{max-width:760px;margin:0 auto;padding:40px 20px;color:#EFE8DB}
#pick h1{font-size:44px;margin:6px 0 10px}#pick p{color:#A89F90}
#pick input{font:inherit;width:100%;padding:12px 14px;border-radius:10px;border:1px solid #3A342D;background:#25211C;color:#EFE8DB}
#pick label{display:block;margin:16px 0 6px;font-weight:600}
#res{list-style:none;padding:0;margin:10px 0 0}#res li button{width:100%;text-align:left;font:inherit;background:#25211C;color:#EFE8DB;border:1px solid #3A342D;border-radius:10px;padding:10px 14px;margin-bottom:6px;cursor:pointer}
#res li button:hover,#res li button:focus{border-color:#D98A66}#res .t{color:#A89F90;font-size:14px}
.ours{color:#D2B15E;font-size:12px;margin-left:6px}
/* deck */
#deck{position:fixed;inset:0 0 52px 0;display:flex;align-items:center;justify-content:center}
.slide{position:absolute;width:1280px;height:720px;background:var(--bg);border-radius:6px;overflow:hidden;padding:64px 80px;display:none;transform-origin:center center}
.slide.on{display:block}
.slide h2{font-size:58px;margin:10px 0 22px;max-width:15em}
.slide p.lead{font-size:24px;color:var(--muted);max-width:40em;margin:0 0 22px}
.slide ul{margin:0;padding:0;list-style:none;font-size:23px;max-width:44em}
.slide ul li{padding:10px 0 10px 34px;position:relative;border-bottom:1px solid var(--line)}
.slide ul li::before{content:'';position:absolute;left:4px;top:22px;width:12px;height:12px;border-radius:50%;background:var(--terra)}
.slide .foot{position:absolute;left:80px;right:80px;bottom:34px;display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.logo{font-family:Cinzel,serif;font-weight:600;letter-spacing:.22em;font-size:18px}
.cover{background:#231F1A;color:#EFE8DB;display:none}
.cover.on{display:flex;flex-direction:column;justify-content:center}
.cover h1{font-size:96px;margin:18px 0 14px;max-width:11em}.cover .sub{font-size:26px;color:#C9BFAE}
.cover .foot{color:#A89F90}
.two{display:grid;grid-template-columns:1.15fr 1fr;gap:44px;align-items:start}
.mapbox{height:470px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--bg2)}
.big{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:88px;line-height:1;color:var(--terra)}
.stat{margin-bottom:22px}.stat .l{font-size:20px;color:var(--muted)}
.near{font-size:18px;color:var(--muted);margin-top:6px;line-height:1.5}
.pill{display:inline-block;font-size:16px;padding:4px 12px;border-radius:999px;background:var(--bg2);border:1px solid var(--line)}
.pill.ok{background:#E3EEDF;border-color:#B9D0B4;color:#2C4F31}
table.price{border-collapse:collapse;font-size:24px;margin-top:6px;min-width:820px}
table.price th,table.price td{padding:12px 18px;border-bottom:1px solid var(--line);text-align:left}
table.price th{font-size:16px;color:var(--muted);font-weight:600}
table.price td.n{font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:600}
.note{font-size:18px;color:var(--muted);margin-top:16px;max-width:52em}
.steps{counter-reset:s}.steps li::before{counter-increment:s;content:counter(s);background:var(--terra);color:var(--terra-ink);width:26px;height:26px;top:14px;left:0;font-size:15px;display:flex;align-items:center;justify-content:center;font-weight:600}
.steps li{padding-left:44px}
.slide.wide h2{font-size:46px;max-width:none;margin-bottom:18px}
.shotgrid{display:grid;grid-template-columns:1fr 1.1fr;gap:34px;align-items:start}
.shotgrid ul{font-size:19px}.shotgrid ul li{padding:8px 0 8px 30px}.shotgrid ul li::before{top:17px}.shotgrid .money{font-size:18px;margin-top:16px;padding:14px 16px}
.shotgrid .steps li{padding-left:40px}
.shot{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 12px 32px rgba(35,31,26,.14);background:#fff}
.shot img{display:block;width:100%;max-height:440px;object-fit:cover;object-position:top}
.money{font-size:22px;margin-top:22px;padding:18px 22px;background:var(--card);border:1px solid var(--line);border-radius:12px;max-width:40em}
/* controls */
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;align-items:center;padding:10px;color:#A89F90;font-size:14px}
#bar button,#bar a{font:inherit;background:#25211C;color:#EFE8DB;border:1px solid #3A342D;border-radius:8px;padding:6px 12px;cursor:pointer;text-decoration:none}
@media print{
  @page{size:13.333in 7.5in;margin:0}
  html,body{background:#fff;height:auto}
  #bar,#pick{display:none!important}
  #deck{position:static;display:block}
  .slide,.cover{display:block!important;position:relative;transform:none!important;width:13.333in;height:7.5in;border-radius:0;page-break-after:always;padding:.66in .83in}
  .cover{display:flex!important}
}

/* one-page leave-behind (letter size), printed on its own */
#leave{background:#fff;color:#231F1A;width:8.5in;min-height:11in;margin:0 auto;padding:.55in .6in;font:12.5px/1.45 Inter,system-ui,sans-serif}
#leave .lt{font-family:Cinzel,serif;letter-spacing:.22em;font-weight:600;font-size:15px}#leave h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:32px;line-height:1.05;margin:14px 0 4px}
#leave .sub{color:#6A6259;margin:0 0 14px;font-size:13.5px}#leave .g{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px}
#leave h3{font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;margin:0 0 4px}#leave ul{margin:0;padding-left:16px}#leave li{margin:0 0 3px}
#leave .box{border:1px solid #D5CCBA;border-radius:10px;padding:10px 12px}#leave .price{background:#F4EFE6}#leave table{border-collapse:collapse;width:100%}#leave td{padding:3px 0}#leave td.n{text-align:right;font-weight:600}
#leave .foot{margin-top:14px;padding-top:10px;border-top:1px solid #D5CCBA;display:flex;justify-content:space-between;gap:12px;font-size:12px}
#leave .cap{color:#A8842F}
body.lbmode #deck,body.lbmode #bar{display:none!important}
body.lbmode{background:#EBE4D6;overflow:auto;height:auto}
#lbbar{position:fixed;top:10px;right:10px;display:flex;gap:8px}#lbbar button{font:inherit;background:#25211C;color:#EFE8DB;border:1px solid #3A342D;border-radius:8px;padding:6px 12px;cursor:pointer}
@media print{ body.lbmode #leave{page:leave;margin:0;width:auto;min-height:0;padding:0} body.lbmode #lbbar{display:none} @page leave{size:letter;margin:.5in} }
</style>
</head>
<body>

<section id="pick" hidden>
 <div class="cap">Tabella</div>
 <h1>Pitch a mall</h1>
 <p>Pick the shop from the Tabella map, and the deck fills in its name, town, its listing and the shops around it. Then present it, or print it as a handout.</p>
 <label for="q">Find the shop</label>
 <input id="q" placeholder="Relics, The Maze, or a town" autocomplete="off">
 <label for="nb">Booths in the mall <span style="font-weight:400;color:#A89F90">(for the price slide; a guess is fine)</span></label>
 <input id="nb" type="number" min="1" max="2000" value="100" style="max-width:180px">
 <label for="dl">A dealer looking for a booth there <span style="font-weight:400;color:#A89F90">(optional, like Shantiques)</span></label>
 <input id="dl" maxlength="60" placeholder="Shantiques" style="max-width:360px">
 <ul id="res"></ul>
 <p id="pmsg"></p>
</section>

<div id="deck" hidden></div>
<div id="leave" hidden></div>
<div id="bar" hidden><button type="button" id="prev" aria-label="Previous slide">&larr;</button><span id="pos"></span><button type="button" id="next" aria-label="Next slide">&rarr;</button>
 <button type="button" id="full">Full screen</button><button type="button" id="prt">Print or PDF</button><button type="button" id="lb">One-page leave-behind</button><a href="./" id="other">Another mall</a></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
var API='https://tabella-shipping.shawn-greene1981.workers.dev',$=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function slug(t){return t.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,120)}
function hav(a,b){var R=3958.8,r=Math.PI/180,x=(b[0]-a[0])*r,y=(b[1]-a[1])*r,h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(h))}
var qs=new URLSearchParams(location.search);

// ---------- the map's data: our own shops (map.html), saved trip details (Worker) and the nationwide list (data/shops)
var SHOPS={};
async function loadOurs(){
  var html=await (await fetch('../map.html',{cache:'no-cache'})).text();
  var T=Function('return '+html.match(/var T=(\{[\s\S]*?\});/)[1])(),M=Function('return '+html.match(/var M=(\[[\s\S]*?\]);/)[1])();
  M.forEach(function(m){if(!T[m[1]])return;var id=slug(m[0]+' '+m[1]);SHOPS[id]={id:id,name:m[0],town:m[1],ll:T[m[1]].slice(),best:m[3]||'',ours:true,trip:m[2]}});
  try{var r=await (await fetch(API+'/trip/shops')).json();(r.shops||[]).forEach(function(e){if(e.s==='x'){delete SHOPS[e.id];return}
    var p=SHOPS[e.id]||(e.ll||T[e.town]?SHOPS[e.id]={id:e.id,name:e.name,town:e.town,ll:(e.ll||T[e.town]).slice(),best:'',ours:e.s!=='o'}:null);if(!p)return;
    if(e.ll)p.ll=e.ll.slice();if(e.best)p.best=e.best;if(e.addr)p.addr=e.addr;if(e.verified){p.verified=true;p.website=e.website||''}})}catch(e){}
}
var IDX=null,TILES={};
async function tile(k){if(!TILES[k])TILES[k]=fetch('../data/shops/'+k+'.json').then(function(r){return r.ok?r.json():[]}).catch(function(){return[]});return TILES[k]}
async function index(){if(!IDX)IDX=await (await fetch('../data/shops/index.json')).json();return IDX}
function tkey(lat,lon,sz){return Math.floor(lat/sz)*sz+'_'+Math.floor(lon/sz)*sz}
async function osmNear(ll,miles){var ix=await index(),sz=ix.tile||4,keys={};
  [-1,0,1].forEach(function(a){[-1,0,1].forEach(function(b){var k=tkey(ll[0]+a*sz*.5,ll[1]+b*sz*.5,sz);if((Array.isArray(ix.tiles)?ix.tiles.some(function(t){return t[0]===k}):ix.tiles[k]))keys[k]=1})});
  var lists=await Promise.all(Object.keys(keys).map(tile)),out=[];
  lists.forEach(function(l){l.forEach(function(s){var d=hav(ll,[s[1],s[2]]);if(d<=miles)out.push({id:s[0],name:s[3],town:s[4]||'',ll:[s[1],s[2]],d:d})})});return out}
function core(n){return n.toLowerCase().normalize('NFKD').replace(/['’]/g,'').replace(/&/g,' and ').replace(/[^a-z0-9 ]+/g,' ').split(/\s+/).filter(function(w){return w&&!/^(the|and|antiques?|mall|market(place)?|vintage|co|llc|inc|shoppes?|shops?|store|of|at)$/.test(w)}).join(' ')}

// ---------- picker
async function picker(){$('pick').hidden=false;$('pmsg').textContent='Loading the map...';
  await loadOurs();$('pmsg').textContent='';var all=null;
  function draw(list){$('res').innerHTML=list.slice(0,30).map(function(p){return '<li><button type="button" data-id="'+esc(p.id)+'"><b>'+esc(p.name)+'</b>'+(p.ours?'<span class="ours">ON OUR MAP</span>':'')+'<br><span class="t">'+esc(p.town||'')+'</span></button></li>'}).join('')||'<li class="t">No match. Try the town.</li>';
    $('res').querySelectorAll('button').forEach(function(b){b.onclick=function(){location.search='?shop='+encodeURIComponent(b.dataset.id)+'&booths='+encodeURIComponent($('nb').value||100)+($('dl').value.trim()?'&dealer='+encodeURIComponent($('dl').value.trim()):'')}})}
  function list(){var q=$('q').value.trim().toLowerCase(),ours=Object.values(SHOPS);
    if(!q){draw(ours.filter(function(p){return p.ours}).sort(function(a,b){return a.town.localeCompare(b.town)}));return}
    var m=ours.concat(all||[]).filter(function(p){return (p.name+' '+p.town).toLowerCase().indexOf(q)>=0});draw(m)}
  $('q').oninput=list;list();
  // the nationwide list, for shops we haven't been to
  index().then(function(ix){var ks=Array.isArray(ix.tiles)?ix.tiles.map(function(t){return t[0]}):Object.keys(ix.tiles);
    return Promise.all(ks.map(tile))}).then(function(ls){all=[];ls.forEach(function(l){l.forEach(function(s){all.push({id:s[0],name:s[3],town:s[4]||'',ll:[s[1],s[2]]})})});if($('q').value)list()});
}

// ---------- pricing (same as pricing.html): first 30 booths at the top rate, next 30 at the middle, the rest at the lowest
var RATES=[1.80,1.10,.70],YEAR_MONTHS=10; // one transparent price, everything included
function cost(n,r){return Math.min(n,30)*r[0]+Math.min(Math.max(n-30,0),30)*r[1]+Math.max(n-60,0)*r[2]}
function $m(v){v=Math.round(v*100)/100;return '$'+v.toLocaleString('en-US',{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2})}

// ---------- the deck
async function deck(id){
  await loadOurs();var p=SHOPS[id];
  if(!p&&/^osm-/.test(id)){var ix=await index(),ks=Array.isArray(ix.tiles)?ix.tiles.map(function(t){return t[0]}):Object.keys(ix.tiles);
    for(var i=0;i<ks.length&&!p;i++){(await tile(ks[i])).forEach(function(s){if(s[0]===id)p={id:s[0],name:s[3],town:s[4]||'',ll:[s[1],s[2]],ours:false}})}}
  if(!p){$('pick').hidden=false;$('pmsg').textContent='That shop isn’t on the map anymore. Pick it again.';picker();return}
  var booths=Math.max(1,Math.min(2000,parseInt(qs.get('booths'),10)||100));
  var town=p.town.replace(/,\s*[A-Z]{2}$/,''),name=p.name,short=name;
  // nearby shops: ours plus the nationwide list, without counting the same shop twice
  var osm=await osmNear(p.ll,25),near=[];Object.values(SHOPS).forEach(function(s){if(s.id!==p.id){var d=hav(p.ll,s.ll);if(d<=25)near.push({name:s.name,town:s.town,ll:s.ll,d:d})}});
  osm.forEach(function(o){var c=core(o.name);if(o.id===p.id||core(p.name)===c)return;if(!near.some(function(n){return core(n.name)===c}))near.push(o)});
  near.sort(function(a,b){return a.d-b.d});var within10=near.filter(function(n){return n.d<=10}).length;
  var date=new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  var foot='<div class="foot"><span class="logo">TABELLA</span><span>Prepared for '+esc(name)+'</span></div>';
  var S=[];
  S.push('<section class="slide cover"><div class="cap">Prepared for</div><h1>'+esc(name)+'</h1><div class="sub">'+esc(p.town)+' &middot; '+esc(date)+'</div><div class="foot"><span class="logo">TABELLA</span><span>tabellasuite.com</span></div></section>');
  S.push('<section class="slide"><div class="cap">Already on the map</div><h2>Shoppers can find '+esc(name)+' on Tabella today.</h2><div class="two"><div class="mapbox" id="mbox"></div><div>'+
    '<div class="stat"><div class="big">'+near.length+'</div><div class="l">other antique and vintage shops within 25 miles'+(within10?', '+within10+' of them within 10':'')+'</div></div>'+
    '<p style="font-size:21px;margin:0 0 12px">Road-trippers plan their routes through '+esc(town)+' on the Tabella map. '+(p.verified?esc(name)+'’s listing is <span class="pill ok">Verified</span>.':'Your free listing is ready to claim.')+'</p>'+
    (near.length?'<div class="near">Nearby: '+near.slice(0,6).map(function(n){return esc(n.name)}).join(', ')+(near.length>6?', and more':'')+'</div>':'')+'</div></div>'+foot+'</section>');
  S.push('<section class="slide"><div class="cap">The problem</div><h2>Shoppers want to see the booths before they drive.</h2><ul>'+
    '<li>Most malls can’t show what’s on the shelves, so shoppers guess, or don’t come.</li>'+
    '<li>Dealers sell their best pieces online elsewhere, and the mall earns nothing from it.</li>'+
    '<li>Month end is paper tags, a register tape and an evening of math for every booth.</li></ul>'+foot+'</section>');
  S.push('<section class="slide wide"><div class="cap">Online</div><h2>Every booth at '+esc(short)+', online.</h2><div class="shotgrid"><div><ul>'+
    '<li>Dealers photograph a piece and it’s in the Tabella shop, with the booth it sits in.</li>'+
    '<li><b>'+esc(name)+' earns 4% of every online sale</b> from its booths, without lifting a finger.</li>'+
    '<li>Shoppers can pick up at your counter, so online orders bring people through your door.</li></ul>'+
    '<div class="money">If your dealers sell $2,500 a month online, '+esc(name)+' earns <b>$100 a month</b>. That alone covers Tabella for about '+(function(){for(var n=200;n>0;n--)if(cost(n,RATES)<=100)return n;return 0})()+' booths.</div>'+'</div><figure class="shot"><img src="img/dealer.jpg" alt="The dealer app: add a piece with a photo and price"></figure></div>'+foot+'</section>');
  var dealer=String(qs.get('dealer')||'').trim().slice(0,60);
  S.push('<section class="slide wide"><div class="cap">Booth finder</div><h2>New dealers arrive with their shop already online.</h2><div class="shotgrid"><div><ul>'+
    '<li>Anyone can open a Tabella shop online, free, and start selling before they have a booth.</li>'+
    '<li>When they want a brick-and-mortar home, they find malls like '+esc(short)+' on the Tabella map.</li>'+
    '<li><b>Before you say yes, you see their pieces and prices</b> in their Tabella shop: exactly what would go in your booth.</li>'+
    '<li>They arrive with Tabella tags on their pieces, ready to scan at your register.</li></ul>'+
    (dealer?'<div class="money"><b>'+esc(dealer)+'</b> is a Tabella dealer looking for a booth in '+esc(town)+'. See their pieces today: <b>tabellasuite.com/shop/?dealer='+esc(slug(dealer))+'</b></div>'
           :'<div class="money">Fill an empty booth faster, with a dealer whose pieces you have already seen.</div>')+'</div><figure class="shot"><img src="img/shop.jpg" alt="A dealer’s Tabella shop, the way a mall sees it"></figure></div>'+foot+'</section>');
  S.push('<section class="slide wide"><div class="cap">In the mall</div><h2>A register made for booths.</h2><div class="shotgrid"><div><ul>'+
    '<li>Scan the tag: price, booth and dealer come up. Paper tags work too, by booth number and price.</li>'+
    '<li>Cash or card on the Tabella reader. The piece comes off the website the moment it sells.</li>'+
    '<li>Card money for dealers on Tabella goes straight to their bank. No more checks for those booths.</li>'+
    '<li>Runs on a tablet in the browser. Nothing to install.</li></ul>'+'</div><figure class="shot"><img src="img/register.jpg" alt="The register: tagged pieces and paper-tag booths in one sale"></figure></div>'+foot+'</section>');
  S.push('<section class="slide wide"><div class="cap">Month end</div><h2>Month end takes minutes, not an evening.</h2><div class="shotgrid"><div><ul>'+
    '<li>A statement for every booth: each sale, your commission, card fees and booth rent.</li>'+
    '<li>Rent can come out of card sales first, so you aren’t chasing it.</li>'+
    '<li>Statements email themselves on the day you pick. Mark a booth paid when you write the check.</li>'+
    '<li>A spreadsheet of the month for your books.</li></ul>'+'</div><figure class="shot"><img src="img/statements.jpg" alt="Month end: every booth’s statement, rent and what you owe"></figure></div>'+foot+'</section>');
  S.push('<section class="slide"><div class="cap">What it costs</div><h2>For '+booths+' booths at '+esc(short)+'.</h2>'+
    '<table class="price"><tbody>'+
    '<tr><td>Per month</td><td class="n">'+$m(cost(booths,RATES))+'</td></tr>'+
    '<tr><td>Per year (2 months free)</td><td class="n">'+$m(cost(booths,RATES)*YEAR_MONTHS)+'</td></tr>'+
    '<tr><td>Per booth, on average</td><td>'+$m(cost(booths,RATES)/booths)+'</td></tr>'+
    '<tr><td>Setup help</td><td>Free</td></tr></tbody></table>'+
