<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thank you | Tabella</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap">
<style>

:root{--bg:#F4EFE6;--bg2:#EBE4D6;--ink:#231F1A;--muted:#6A6259;--line:#D5CCBA;--terra:#9A4A2E;--terra-ink:#FFF8F0;--gold:#A8842F;--card:#FBF8F2;--focus:#2F6FA8;--green:#3F6B45;--grey:#8C8478}
@media (prefers-color-scheme:dark){:root{--bg:#1A1714;--bg2:#221E1A;--ink:#EFE8DB;--muted:#A89F90;--line:#3A342D;--terra:#D98A66;--terra-ink:#1A1714;--gold:#D2B15E;--card:#25211C;--focus:#7FB8E6;--green:#8DBE8F;--grey:#9C9486}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Inter,system-ui,sans-serif;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
a{color:var(--terra)}
.w{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
.cap{font-family:Cinzel,'Times New Roman',serif;letter-spacing:.18em;text-transform:uppercase;font-size:.78rem;color:var(--gold);font-weight:600}

.logo{font-family:Cinzel,serif;font-weight:600;letter-spacing:.22em;font-size:1.05rem;text-decoration:none;color:var(--ink)}
header.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 0;flex-wrap:wrap}nav.main{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center}nav.main a{font-size:.92rem;text-decoration:none;color:var(--muted);padding:6px 0}nav.main a:hover,nav.main a[aria-current]{color:var(--ink)}nav.main a.cta{color:var(--terra-ink);background:var(--terra);padding:7px 14px;border-radius:6px;font-weight:600}@media(max-width:640px){nav.main a.opt{display:none}}
h1{font-size:clamp(2.4rem,5.6vw,4rem);margin:10px 0 14px}
.lede{font-size:1.12rem;color:var(--muted);max-width:38em;margin:0 0 22px}
a:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.test{background:var(--gold);color:#1A1714;font-weight:600;font-size:.9rem;padding:9px 14px;border-radius:8px;margin:0 0 18px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:0 0 18px}
.chips button{font:500 .85rem Inter,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px;min-height:36px;cursor:pointer;margin:0 6px 6px 0}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;list-style:none;margin:0;padding:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.card button.open{all:unset;cursor:pointer;display:block}
.card button.open:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.ph{aspect-ratio:1/1;background:var(--bg2);overflow:hidden}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.cb h3{font-size:1.2rem}
.meta{font-size:.82rem;color:var(--muted)}
.price{font-weight:600;font-size:1.05rem}
.btn{font:600 .92rem Inter,sans-serif;border:0;border-radius:8px;padding:10px 16px;min-height:44px;cursor:pointer;background:var(--terra);color:var(--terra-ink)}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.soonb{display:inline-block;align-self:flex-start;font-size:.75rem;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 9px}
.cartbtn{position:sticky;top:10px;z-index:5}
dialog{border:0;border-radius:14px;padding:0;max-height:92vh;overflow:auto;max-width:min(560px,94vw);width:100%;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(20,16,12,.55)}
.dlg{padding:18px 20px 20px}
.dlg img{width:100%;border-radius:8px;max-height:60vh;object-fit:contain;background:var(--bg2)}
.x{float:right;background:none;border:0;font-size:1.6rem;line-height:1;cursor:pointer;color:var(--muted);min-width:44px;min-height:44px}
.rm{background:none;border:0;color:var(--terra);font:500 .85rem Inter,sans-serif;cursor:pointer;min-height:36px;text-decoration:underline}
label{display:block;font-size:.85rem;margin:8px 0 2px}
input{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.row2{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.rate{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer}
.rate input{width:auto}
.msg{border-radius:8px;padding:10px 12px;margin:10px 0;font-size:.92rem}.msg.err{background:#F6E2DC;color:#7A2A17}.msg.ok{background:#E3EEDF;color:#264B2B}
.empty{color:var(--muted);padding:20px 0}
footer{padding:36px 0 48px;border-top:1px solid var(--line);margin-top:48px;font-size:.88rem;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
</style>
</head>
<body>
<div class="w">
<header class="top"><a class="logo" href="../">TABELLA</a><nav class="main" aria-label="Main"><a class="opt" href="../#shoppers">Shoppers</a><a class="opt" href="../#dealers">Dealers</a><a class="opt" href="../#malls">Malls</a><a href="../shop/">Shop</a><a href="../map.html">Mall map</a><a class="opt" href="../road-trip-1.html">Road trips</a><a class="opt" href="../pricing.html">Pricing</a><a class="cta" href="../#early">Early access</a></nav></header>
<main>
<p class="test" role="note">Test shop. This was a sandbox payment: no real money moved.</p>
<div class="cap">Order</div>
<h1 id="h">Thank you</h1>
<div id="o" class="lede">Loading your order...</div>
<p><a href="./">Back to the shop</a></p>
</main>
<footer><span>&copy; <span id="y"></span> Tabella Suite &middot; <a href="mailto:contact@tabellasuite.com">contact@tabellasuite.com</a></span><span><a href="../pricing.html">Pricing</a> &middot; <a href="../privacy.html">Privacy</a></span></footer>
</div>
<script>
(function(){
var API='https://tabella-shipping.shawn-greene1981.workers.dev';function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fm(n){return '$'+Number(n).toFixed(2)}
function row(a,b,bold){return '<div style="display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:6px 0">'+(bold?'<b>'+a+'</b><b>'+b+'</b>':'<span>'+a+'</span><span>'+b+'</span>')+'</div>'}
document.getElementById('y').textContent=new Date().getFullYear();
var ref=(location.search.match(/order=(o_[a-z0-9]+)/)||[])[1],o=document.getElementById('o'),tries=0;
if(!ref){o.textContent='We could not find an order number. If you were charged, write to contact@tabellasuite.com.';return}
function load(){fetch(API+'/shop/order?ref='+ref).then(function(r){return r.json()}).then(function(d){
  if(d.error){o.textContent='We could not find that order. If you were charged, write to contact@tabellasuite.com with order '+ref+'.';return}
  if(d.status!=='paid'&&tries++<6){o.textContent='Confirming your payment...';setTimeout(load,2500);return}
  if(d.status==='paid'){try{localStorage.removeItem('tabCart')}catch(e){}}
  document.getElementById('h').textContent=d.status==='paid'?'Thank you, your order is in':'Your order';
  o.innerHTML='<p>Order <b>'+esc(d.ref)+'</b>. '+(d.status==='paid'?'Payment received. We will email tracking when it ships.':'We are still confirming your payment. Check your email for the receipt.')+'</p>'+
   d.items.map(function(i){return row(esc(i.title),fm(i.price))}).join('')+
   (d.shipping?row('Shipping, '+esc(d.shipping.carrier)+' '+esc(d.shipping.service||''),fm(d.shipping.amount)):'')+
   (d.total?row('Total charged',fm(d.total),1):'')}).catch(function(){o.textContent='Could not load your order. Refresh to try again.'})}
load();
})();
</script>
</body>
</html>
